<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" role="img" aria-label="Local PDF Editor interface preview">
  <defs>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1d4ed8"/>
      <stop offset="1" stop-color="#0ea5e9"/>
    </linearGradient>
  </defs>
  <rect width="400" height="240" rx="12" fill="#ffffff" stroke="#dde4ee"/>
  <!-- window chrome -->
  <path d="M12 0h376a12 12 0 0 1 12 12v26H0V12A12 12 0 0 1 12 0z" fill="#f1f5f9"/>
  <circle cx="18" cy="19" r="5" fill="#f87171"/>
  <circle cx="36" cy="19" r="5" fill="#fbbf24"/>
  <circle cx="54" cy="19" r="5" fill="#34d399"/>
  <rect x="74" y="11" width="180" height="16" rx="8" fill="#e2e8f0"/>
  <text x="84" y="23" font-family="Segoe UI, sans-serif" font-size="10" fill="#64748b">pdf-editor.local</text>
  <!-- title bar -->
  <rect x="16" y="52" width="368" height="34" rx="8" fill="url(#bar)"/>
  <text x="30" y="74" font-family="Segoe UI, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">Document.pdf</text>
  <rect x="306" y="59" width="66" height="20" rx="10" fill="#ffffff" opacity="0.9"/>
  <text x="320" y="73" font-family="Segoe UI, sans-serif" font-size="10" font-weight="bold" fill="#1d4ed8">EXPORT</text>
  <!-- page rail -->
  <g fill="#f8fafc" stroke="#dde4ee">
    <rect x="18" y="98" width="38" height="50" rx="3"/>
    <rect x="18" y="156" width="38" height="50" rx="3"/>
  </g>
  <rect x="17" y="97" width="40" height="52" rx="4" fill="none" stroke="#1d4ed8" stroke-width="1.5"/>
  <g fill="#cbd5e1">
    <rect x="24" y="107" width="26" height="3" rx="1.5"/>
    <rect x="24" y="115" width="26" height="3" rx="1.5"/>
    <rect x="24" y="123" width="18" height="3" rx="1.5"/>
    <rect x="24" y="165" width="26" height="3" rx="1.5"/>
    <rect x="24" y="173" width="20" height="3" rx="1.5"/>
  </g>
  <!-- page -->
  <rect x="68" y="96" width="216" height="134" rx="4" fill="#f8fafc" stroke="#dde4ee"/>
  <g fill="#cbd5e1">
    <rect x="84" y="110" width="184" height="5" rx="2.5"/>
    <rect x="84" y="145" width="150" height="5" rx="2.5"/>
    <rect x="84" y="158" width="184" height="5" rx="2.5"/>
  </g>
  <rect x="82" y="122" width="160" height="16" rx="3" fill="#dbeafe" stroke="#1d4ed8"/>
  <text x="88" y="134" font-family="Segoe UI, sans-serif" font-size="10" fill="#1e3a8a">Edited text on the page</text>
  <path d="M90 204c10-16 18-18 20-9s-6 13 2 8 12-14 16-8 2 12 12 6 12-8 26-6" fill="none" stroke="#1d4ed8" stroke-width="2" stroke-linecap="round"/>
  <rect x="84" y="212" width="96" height="1.5" fill="#94a3b8"/>
  <!-- tools -->
  <g font-family="Segoe UI, sans-serif" font-size="10" font-weight="bold">
    <rect x="296" y="98" width="88" height="24" rx="6" fill="#1d4ed8"/>
    <text x="340" y="114" text-anchor="middle" fill="#ffffff">Edit text</text>
    <rect x="296" y="128" width="88" height="24" rx="6" fill="#f1f5f9"/>
    <text x="340" y="144" text-anchor="middle" fill="#334155">Sign</text>
    <rect x="296" y="158" width="88" height="24" rx="6" fill="#f1f5f9"/>
    <text x="340" y="174" text-anchor="middle" fill="#334155">Fill form</text>
    <rect x="296" y="188" width="88" height="24" rx="6" fill="#f1f5f9"/>
    <text x="340" y="204" text-anchor="middle" fill="#334155">Merge pages</text>
  </g>
</svg>
